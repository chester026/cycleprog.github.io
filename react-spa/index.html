<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title/description + Open Graph for link previews. og:image must be
         an absolute-path file served from public/ — the owner drops the
         1200x630 JPEG at public/og.jpg (agents don't add binaries). -->
    <meta name="description" content="BikeLab turns every Strava ride into training plans, bike maintenance alerts and long-term progress you can see, with an AI coach that knows your bike." />
    <meta property="og:title" content="BikeLab — ride wisely" />
    <meta property="og:description" content="An AI-backed cycling coach: training plans, bike maintenance alerts, and long-term progress from every ride." />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Icons live in public/ (owner-supplied binaries, see
         public/manifest.webmanifest for the PWA set). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#191b20">

    <!-- Preconnect to external domains (still needed for the landing page's
         Archivo Black / Caveat display fonts below; Inter + Material
         Symbols are self-hosted npm packages now — T-6.5/W-41, see
         src/fonts.js — so their Google Fonts <link>s are gone). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Landing page display fonts (Archivo Black headlines, Caveat handwritten accents) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">

    <!-- Fallback for fonts -->
    <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
    </noscript>

    <title>BikeLab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
